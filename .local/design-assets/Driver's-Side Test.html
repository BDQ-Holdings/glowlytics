<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  :root {
    --bg: #F5EFE8; --surface: #FBF7F2; --ink: #2A1F2D; --muted: #7A6A75;
    --accent: #5A3A5E; --accent2: #D9A28B; --glow: #E8C9B8; --hairline: #E8C9B855;
  }
  html[data-palette="meadow"] {
    --bg: #EEF1EA; --surface: #F8FAF4; --ink: #1F2A24; --muted: #6E7A72;
    --accent: #3D6B52; --accent2: #C9B786; --glow: #CFE0C8; --hairline: #CFE0C855;
  }
  html[data-palette="rose"] {
    --bg: #F6ECEB; --surface: #FCF5F4; --ink: #2D1F23; --muted: #85686D;
    --accent: #A14A55; --accent2: #E0B8A6; --glow: #EFD2CE; --hairline: #EFD2CE55;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Switzer', -apple-system, sans-serif;
    background: var(--bg); color: var(--ink);
    -webkit-font-smoothing: antialiased;
    transition: background 400ms ease;
  }
  button { font-family: inherit; }
  input { font-family: inherit; }

  /* ─── page ─── */
  .dst-page {
    min-height: 100vh; min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
    background:
      radial-gradient(circle at 12% 18%, var(--glow) 0%, transparent 34%),
      radial-gradient(circle at 88% 84%, color-mix(in oklab, var(--accent2) 50%, transparent) 0%, transparent 38%),
      var(--bg);
    transition: background 400ms ease;
  }

  /* desktop chrome (wordmark) — hidden on small screens */
  .dst-chrome { display: none; }
  @media (min-width: 760px) {
    .dst-chrome {
      display: flex; align-items: baseline; gap: 16px;
      position: fixed; top: 30px; left: 38px; z-index: 10;
    }
    .dst-wordmark {
      font-family: 'Dancing Script', cursive; font-size: 30px; font-weight: 600;
      color: var(--ink); letter-spacing: -0.5px; line-height: 1;
    }
    .dst-wordmark em { color: var(--accent); font-style: normal; }
    .dst-chrome-eyebrow {
      font-size: 11px; letter-spacing: 1.6px; text-transform: uppercase;
      color: var(--muted); font-weight: 500;
    }
  }

  /* ─── stage ─── */
  .dst-stage-wrap {
    display: flex; align-items: center; justify-content: center;
    width: 100%; min-height: 100dvh; padding: 0;
  }
  .dst-stage {
    position: relative; overflow: hidden;
    width: 100vw; height: 100vh; height: 100dvh;
    background: var(--bg);
  }
  @media (min-width: 600px) {
    .dst-stage {
      width: 414px;
      height: min(884px, calc(100dvh - 48px));
      border-radius: 36px;
      box-shadow: 0 40px 100px -30px rgba(42,31,45,0.45), 0 0 0 1px var(--hairline);
    }
  }
  .dst-screen { height: 100%; animation: dst-screen-in 480ms cubic-bezier(.2,.8,.2,1); }

  @keyframes dst-screen-in {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes dst-pulse {
    0%, 100% { box-shadow: 0 0 0 2px #fff, 0 0 30px rgba(217,162,139,0.5); }
    50%      { box-shadow: 0 0 0 2px #fff, 0 0 56px rgba(217,162,139,0.85); }
  }
  @keyframes dst-spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .dst-screen { animation: none; }
  }
</style>
</head>

    <path d="M50 20 a22 30 0 0 0 0 60 Z" fill="#D9A28B" opacity="0.55"/>
    <line x1="50" y1="20" x2="50" y2="80" stroke="#5A3A5E" stroke-width="1.5" stroke-dasharray="3 4"/>
  </svg>
</template>
