name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Frontend: TypeScript + Jest ───────────────────────────────
  frontend-check:
    name: Frontend · Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --legacy-peer-deps --workspaces --include-workspace-root
      - run: npx tsc --noEmit -p apps/glowlytics
      - run: npm test --workspace=glowlytics -- --ci --coverage
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: apps/glowlytics/coverage/
          retention-days: 7

  # ─── Backend: Jest + Supertest ─────────────────────────────────
  backend-check:
    name: Backend · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      # Workspaces hoist some deps to root but keep workspace-local ones
      # (e.g. openai, pg, supertest) under apps/glowlytics/backend/node_modules.
      # Root npm ci doesn't reliably populate those even with --workspaces, so
      # do a follow-up install directly in the backend dir to guarantee they
      # exist where Jest's resolver can find them.
      - run: npm ci --legacy-peer-deps --workspaces --include-workspace-root
      - name: Install backend workspace deps
        working-directory: apps/glowlytics/backend
        run: npm install --no-audit --no-fund
      - name: Test
        working-directory: apps/glowlytics/backend
        run: npx jest --ci --coverage
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: apps/glowlytics/backend/coverage/
          retention-days: 7

  # NOTE: The "Backend · Verify ONNX Model URLs" job was removed. It pinned
  # a hardcoded SHA + RadianceIQ/backend/models path that became stale after
  # the rename to apps/glowlytics/backend/models. The runtime download in
  # signal-models.js needs the same update; tracked separately.
